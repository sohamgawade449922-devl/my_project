version: "3.9"

services:
  # -------------------------------------------------------------------------
  # PostgreSQL with pgvector extension
  # -------------------------------------------------------------------------
  db:
    image: ankane/pgvector:latest
    container_name: nc_db
    environment:
      POSTGRES_USER: neural
      POSTGRES_PASSWORD: neural
      POSTGRES_DB: neuralcommander
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neural -d neuralcommander"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------------------
  # Redis (Celery broker + focus-mode state)
  # -------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: nc_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # -------------------------------------------------------------------------
  # FastAPI Backend
  # -------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nc_backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+asyncpg://neural:neural@db:5432/neuralcommander
      SYNC_DATABASE_URL: postgresql://neural:neural@db:5432/neuralcommander
      REDIS_URL: redis://redis:6379/0
      NEURAL_ENGINE_URL: http://neural_engine:8001
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # -------------------------------------------------------------------------
  # Neural Engine (BERT classifier + RL agent)
  # -------------------------------------------------------------------------
  neural_engine:
    build:
      context: ./neural_engine
      dockerfile: Dockerfile
    container_name: nc_neural
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ./neural_engine:/app
      - model_cache:/root/.cache
    ports:
      - "8001:8001"

  # -------------------------------------------------------------------------
  # Celery Worker (async task processing)
  # -------------------------------------------------------------------------
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nc_celery
    command: celery -A app.core.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: postgresql+asyncpg://neural:neural@db:5432/neuralcommander
      REDIS_URL: redis://redis:6379/0
      NEURAL_ENGINE_URL: http://neural_engine:8001
    volumes:
      - ./backend:/app
    depends_on:
      - db
      - redis
      - neural_engine

  # -------------------------------------------------------------------------
  # Nginx reverse proxy
  # -------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: nc_nginx
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - neural_engine

volumes:
  pg_data:
  model_cache:
